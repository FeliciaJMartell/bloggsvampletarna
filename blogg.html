<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna - Svampbloggen</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="blogg.css">
    <script src="blogg.js" defer></script>
</head>
<body>
    <header>
        <h1>Svampletarna</h1>
        <button type="button" id="logoutButton">Logga ut</button>
        <nav>
            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="visa-svampar/visa-svampar.html">Alla Svampar</a></li>
                <li><a href="mina-svampar/mina-svampar.html">Mina Svampar</a></li>
                <li><a href="svampguiden/lookalikes.html">Svampguiden</a></li>
                <li><a href="blogg.html" aria-current="page">Svampbloggen</a></li>
                <li><a href="inloggningssida/inloggning.html">Logga in</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Svampbloggen</h2>
        <!-- Bygger min plats för blogginläggen-->
        <div id="posts">
        </div>

        <!--Bygger min section för att skriva blogginlägg-->
        <section>
            <h3>Skriv ett inlägg</h3>
            <p id="loginMessage" hidden>
                Du måste <a href="inloggningssida/inloggning.html">logga in</a> för att kunna skriva inlägg eller
                kommentera.
            </p>
            <form id="postForm">
                <label for="postTitle">Titel</label>
                <input type="text" id="postTitle" required>

                <label for="postText">Inlägg</label>
                <textarea id="postText" required></textarea>

                <button type="submit">Publicera</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Klass WU26 - Felicia Johansson Martell</p>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampbloggen</title>
    <link rel="stylesheet" href="common.css">
    <script src="blogg.js" defer></script>
</head>

<body>
    <header>
        <h1>Svampletarna</h1>
        <nav>
            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="visa-svampar/visa-svampar.html">Alla Svampar</a></li>
                <li><a href="mina-svampar/mina-svampar.html">Mina Svampar</a></li>
                <li><a href="svampguiden/lookalikes.html">Svampguiden</a></li>
                <li><a href="blogg.html" aria-current="page">Svampbloggen</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Svampbloggen</h2>
        <section>
            <h3>Skriv ett inlägg</h3>
            <form id="postForm">
                <label for="postTitle">Titel</label>
                <input type="text" id="postTitle" required>

                <label for="postText">Inlägg</label>
                <textarea id="postText" required></textarea>

                <button type="submit">Publicera</button>
            </form>
        </section>

        <div id="posts">
            <article>
                <h3>Titel</h3>
                <p>Författare <time datetime="2026-10-21">21 oktober 2026</time></p>
                <p>Blogginlägg</p>
                <section class="comments">
                    <h4>Kommentarer</h4>
                    <article>
                        <p>Författare <time datetime="2026-10-21">21 oktober 2026</time></p>
                        <p>Kommentar</p>
                    </article>
                </section>
            </article>
        </div>

        <button type="button" id="logoutKnapp">Logga ut</button>


    </main>
    <footer>
        <p>Klass WU26 - Felicia Johansson Martell</p>
    </footer>
</body>

</html>

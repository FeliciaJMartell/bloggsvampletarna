<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna - Mina svampar</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="mina-svampar.css">
    <script src="mina-svampar.js" defer></script>
</head>

<body>
    <header>
        <h1>Svampletarna</h1>
        <nav aria-label="Huvudmeny">
            <ul>
                <li><a href="../index.html">Startsida</a></li>
                <li><a href="../visa-svampar/visa-svampar.html">Alla Svampar</a></li>
                <li><a href="mina-svampar.html" aria-current="page">Mina Svampar</a></li>
                <li><a href="../svampguiden/lookalikes.html">Svampguiden</a></li>
                <li><a href="../blogg.html">Svampbloggen</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <header>
            <h1>Mina svampar</h1>
            <!-- Knappen är dold från start. JavaScript visar den när det finns svampar. -->
            <button type="button" id="clear-button" hidden>Töm sparade svampar</button>
        </header>

        <!-- Dolt felmeddelande för fetch -->
        <p id="error-message" role="alert" hidden>Något gick fel när svamparna skulle hämtas...</p>

        <!-- Semantisk sektion för korten med en osynlig rubrik för skärmläsare -->
        <section id="card-container" aria-label="Sparade svampar">
            <h2 class="sr-only">Lista med sparade svampar</h2>
        </section>

        <!-- Visas när inga svampar är sparade -->
        <section id="empty-state" hidden>
            <h2>Du har inte hittat några svampar än</h2>
            <p><a href="index.html">Till svampar</a></p>
        </section>
    </main>

    <footer>
        <p>Grupp 4 WU26 - Linn, Felicia, Zouhir</p>
    </footer>
</body>

</html>
